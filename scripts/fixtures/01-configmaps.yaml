apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
  namespace: test-ns-1
  labels:
    app: nginx-deploy
    tier: frontend
  annotations:
    description: "Application configuration for nginx"
data:
  APP_ENV: "test"
  LOG_LEVEL: "info"
  MAX_CONNECTIONS: "100"
  nginx.conf: |
    server {
      listen 80;
      server_name localhost;

      location / {
        root   /usr/share/nginx/html;
        index  index.html index.htm;
      }

      error_page 500 502 503 504 /50x.html;
      location = /50x.html {
        root /usr/share/nginx/html;
      }
    }
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: db-config
  namespace: test-ns-1
  labels:
    app: postgres
    tier: database
data:
  POSTGRES_DB: "appdb"
  POSTGRES_PORT: "5432"
  pg_hba.conf: |
    # TYPE  DATABASE  USER  ADDRESS  METHOD
    local   all       all            trust
    host    all       all  127.0.0.1/32  trust
    host    all       all  ::1/128       trust
